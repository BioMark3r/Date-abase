services:
  dateabase:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - dateabase_data:/data
    environment:
      - SECRET_KEY=change-me-to-something-romantic-and-secret
      # ── Partner credentials ──────────────────────────────────────────────────
      # Default passwords work for first login. Change them in Settings > Change Password.
      # Passwords set here only apply when a user has NO password yet (first boot).
      # After that, passwords live in the database and env vars are ignored.
      - PARTNER1_NAME=Partner 1
      - PARTNER1_PASSWORD=lovebirds1
      - PARTNER2_NAME=Partner 2
      - PARTNER2_PASSWORD=lovebirds2
      # ── WebAuthn / Face ID ───────────────────────────────────────────────────
      # For Cloudflare Tunnel, set these to your tunnel domain:
      #   APP_DOMAIN=dates.yourdomain.com
      #   APP_ORIGIN=https://dates.yourdomain.com
      - APP_DOMAIN=localhost
      - APP_ORIGIN=http://localhost:8000
      - DATABASE_URL=sqlite:////data/dateabase.db
    restart: unless-stopped

volumes:
  dateabase_data:
